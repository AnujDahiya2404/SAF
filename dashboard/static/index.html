<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAF</title>
<style>
  :root{
    --bg:#0a0d12; --panel:#0e131a; --line:#1c2531;
    --text:#e8edf3; --dim:#5d6b7d;
    --blue:#4da3ff; --green:#37d67a; --amber:#f5a623; --red:#ff5468;
    --mono:'SF Mono',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:
    radial-gradient(1200px 500px at 50% -10%, #111a26 0%, var(--bg) 60%);
    color:var(--text);font-family:-apple-system,'Segoe UI',Helvetica,sans-serif;min-height:100vh;}

  header{display:flex;align-items:baseline;justify-content:space-between;padding:20px 28px 6px;}
  header .brand{display:flex;align-items:baseline;gap:10px}
  header h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.02em}
  header .tag{color:var(--dim);font-size:12px}
  .status{display:flex;align-items:center;gap:16px;font-size:12px;color:var(--dim)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--dim);display:inline-block;margin-right:5px}
  .dot.on{background:var(--green);box-shadow:0 0 6px var(--green)}
  .dot.off{background:var(--red);box-shadow:0 0 6px var(--red)}
  #phase{font-family:var(--mono);font-weight:600;letter-spacing:.03em;transition:color .3s}

  .stage{max-width:1180px;margin:0 auto;padding:10px 28px 8px}
  #wireWrap{width:100%}
  #wire{width:100%;height:auto;display:block;overflow:visible}
  .dev-label{fill:var(--dim);font-size:10.5px;font-family:var(--mono);letter-spacing:.04em}
  .dev-id{fill:var(--text);font-size:12px;font-weight:600}
  .led{transition:fill .25s, filter .25s}
  .led.pass{fill:var(--green);filter:drop-shadow(0 0 4px var(--green))}
  .led.fail{fill:var(--red);filter:drop-shadow(0 0 4px var(--red))}
  .led.idle{fill:#232d3a}

  .readout{display:flex;justify-content:center;gap:10px;align-items:center;margin-top:2px;min-height:22px;
            font-family:var(--mono);font-size:12px;color:var(--dim)}
  .readout .verdict{font-weight:700;letter-spacing:.02em}
  .readout .verdict.pass{color:var(--green)}
  .readout .verdict.gap{color:var(--amber)}
  .readout .verdict.deny{color:var(--red)}

  .toolbar{max-width:1180px;margin:14px auto 0;padding:14px 28px;display:flex;gap:10px;flex-wrap:wrap;
           align-items:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .toolbar input[type=text]{background:#0c1017;border:1px solid var(--line);color:var(--text);
           border-radius:7px;padding:8px 11px;font-size:12.5px;font-family:var(--mono);min-width:110px}
  .toolbar input[type=text]:focus{outline:none;border-color:var(--blue)}
  .toolbar .sep{width:1px;align-self:stretch;background:var(--line);margin:0 4px}
  button{background:#131a24;border:1px solid var(--line);color:var(--text);padding:8px 14px;
         border-radius:7px;font-size:12.5px;cursor:pointer;font-weight:600;transition:.15s}
  button:hover{border-color:var(--blue);color:var(--blue)}
  button:disabled{opacity:.35;cursor:default}
  button.go{background:var(--blue);border-color:var(--blue);color:#04121f}
  button.go:hover{color:#04121f;filter:brightness(1.1)}
  button.warn{color:var(--amber);border-color:rgba(245,166,35,.35)}
  button.warn:hover{border-color:var(--amber)}
  button.bad{color:var(--red);border-color:rgba(255,84,104,.35)}
  button.bad:hover{border-color:var(--red)}

  .switch{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--dim);cursor:pointer;user-select:none}
  .switch input{display:none}
  .track{width:34px;height:19px;border-radius:99px;background:#1a212c;border:1px solid var(--line);position:relative;transition:.2s}
  .track::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--dim);transition:.2s}
  .switch input:checked + .track{background:rgba(55,214,122,.18);border-color:var(--green)}
  .switch input:checked + .track::after{transform:translateX(15px);background:var(--green)}

  .result{font-family:var(--mono);font-size:11.5px;margin-left:auto;color:var(--dim)}
  .result.pass{color:var(--green)}
  .result.fail{color:var(--red)}

  .cols{max-width:1180px;margin:0 auto;padding:16px 28px 40px;display:grid;grid-template-columns:1fr 1.4fr;gap:28px}
  @media (max-width: 880px){.cols{grid-template-columns:1fr}}
  .cols h2{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin:0 0 10px;font-weight:600}
  table.kv{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11.5px}
  table.kv td{padding:5px 0;border-bottom:1px solid var(--line);word-break:break-all}
  table.kv td.k{color:var(--dim);width:110px;white-space:nowrap;padding-right:10px}

  #log{height:230px;overflow-y:auto;font-family:var(--mono);font-size:11px;line-height:1.65}
  .le{padding:1px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .le .t{color:#39445a;margin-right:6px}
  .le .src{color:var(--blue)}
  .le .src.gw{color:var(--amber)}
  .le .src.ver{color:#b98bf5}
  .le .kind{color:var(--dim)}
</style>
</head>
<body>

<header>
  <div class="brand"><h1>SAF</h1><span class="tag">stateful authentication for MQTT</span></div>
  <div class="status">
    <span><span class="dot" id="wsDot"></span><span id="wsLabel">connecting</span></span>
    <span id="phase">idle</span>
  </div>
</header>

<div class="stage">
  <div id="wireWrap">
    <svg id="wire" viewBox="0 0 900 190" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="cableGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#2a3340"/>
          <stop offset="1" stop-color="#12161c"/>
        </linearGradient>
        <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
          <feGaussianBlur stdDeviation="7" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="softglow" x="-100%" y="-100%" width="300%" height="300%">
          <feGaussianBlur stdDeviation="3"/>
        </filter>
      </defs>

      <!-- cable -->
      <rect x="185" y="83" width="530" height="22" rx="11" fill="url(#cableGrad)" stroke="#080a0d" stroke-width="1"/>
      <line id="core" x1="197" y1="94" x2="703" y2="94" stroke="#2a3644" stroke-width="3" stroke-linecap="round"/>
      <rect id="coreFlash" x="185" y="83" width="530" height="22" rx="11" fill="none" stroke="none" stroke-width="3" opacity="0"/>

      <!-- client: chip icon -->
      <g transform="translate(60,54)">
        <rect x="0" y="0" width="90" height="70" rx="10" fill="#101620" stroke="#26313f" stroke-width="1.5"/>
        <rect x="14" y="14" width="62" height="42" rx="4" fill="#0a0e14" stroke="#26313f"/>
        <line x1="20" y1="24" x2="60" y2="24" stroke="#334154" stroke-width="2"/>
        <line x1="20" y1="32" x2="50" y2="32" stroke="#334154" stroke-width="2"/>
        <line x1="20" y1="40" x2="56" y2="40" stroke="#334154" stroke-width="2"/>
        <circle id="clientCore" cx="45" cy="35" r="4" fill="#33475a"/>
        <line x1="90" y1="35" x2="105" y2="35" stroke="#26313f" stroke-width="3"/>
        <text x="45" y="-8" text-anchor="middle" class="dev-id">Client</text>
      </g>

      <!-- broker: rack icon with LEDs -->
      <g transform="translate(750,44)">
        <rect x="0" y="0" width="90" height="90" rx="10" fill="#101620" stroke="#26313f" stroke-width="1.5"/>
        <rect x="10" y="12" width="70" height="14" rx="3" fill="#0a0e14" stroke="#26313f"/>
        <rect x="10" y="32" width="70" height="14" rx="3" fill="#0a0e14" stroke="#26313f"/>
        <rect x="10" y="52" width="70" height="14" rx="3" fill="#0a0e14" stroke="#26313f"/>
        <line x1="-15" y1="45" x2="0" y2="45" stroke="#26313f" stroke-width="3"/>
        <text x="45" y="-8" text-anchor="middle" class="dev-id">Broker</text>
        <g id="leds" transform="translate(16,73)">
          <circle class="led idle" data-p="Secrecy" cx="0" cy="0" r="3.2"><title>Secrecy</title></circle>
          <circle class="led idle" data-p="Alive" cx="14" cy="0" r="3.2"><title>Alive</title></circle>
          <circle class="led idle" data-p="Weakagree" cx="28" cy="0" r="3.2"><title>Weakagree</title></circle>
          <circle class="led idle" data-p="Niagree" cx="42" cy="0" r="3.2"><title>Niagree</title></circle>
          <circle class="led idle" data-p="Nisynch" cx="56" cy="0" r="3.2"><title>Nisynch</title></circle>
        </g>
      </g>

      <!-- traveling pulse -->
      <circle id="pulse" cx="197" cy="94" r="6" fill="#4da3ff" filter="url(#glow)" opacity="0"/>
    </svg>
    <div class="readout"><span id="readout">register a client to begin</span></div>
  </div>
</div>

<div class="toolbar">
  <input type="text" id="clientId" value="AA:BB:CC:00:11:01">
  <button class="go" id="btnRegister">Register</button>
  <div class="sep"></div>
  <input type="text" id="topic" value="sensors/temperature" style="min-width:150px">
  <input type="text" id="payload" value="temp=23.5C" style="min-width:120px">
  <label class="switch"><input type="checkbox" id="hardened"><span class="track"></span>hardened</label>
  <label class="switch"><input type="checkbox" id="encrypt"><span class="track"></span>ascon</label>
  <button id="btnPublish">Publish</button>
  <div class="sep"></div>
  <button class="warn" id="btnTamper">Tamper</button>
  <button class="bad" id="btnReplay">Replay</button>
  <span class="result" id="ctrlResult"></span>
</div>

<div class="cols">
  <div>
    <h2>Data</h2>
    <table class="kv" id="dataTable">
      <tr><td class="k">client</td><td>&mdash;</td></tr>
      <tr><td class="k">x</td><td>&mdash;</td></tr>
      <tr><td class="k">k</td><td>&mdash;</td></tr>
      <tr><td class="k">c</td><td>&mdash;</td></tr>
      <tr><td class="k">alpha</td><td>&mdash;</td></tr>
      <tr><td class="k">idmsg</td><td>&mdash;</td></tr>
      <tr><td class="k">t_msg</td><td>&mdash;</td></tr>
      <tr><td class="k">statusMac</td><td>&mdash;</td></tr>
    </table>
  </div>
  <div>
    <h2>Log</h2>
    <div id="log"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);

// ---------------- wire mechanics ----------------
const pulse = $("pulse"), core = $("core"), coreFlash = $("coreFlash"), readout = $("readout");
const X1 = 197, X2 = 703, Y = 94;
const leds = [...document.querySelectorAll(".led")];

function setLeds(state) {
  // state: null (idle) | {PropName: bool}
  leds.forEach(el => {
    el.classList.remove("pass", "fail", "idle");
    if (!state) { el.classList.add("idle"); return; }
    const v = state[el.dataset.p];
    el.classList.add(v === undefined ? "idle" : (v ? "pass" : "fail"));
  });
}

function travel(dir, color, onArrive) {
  pulse.setAttribute("fill", color);
  pulse.setAttribute("opacity", "1");
  const from = dir === "out" ? X1 : X2, to = dir === "out" ? X2 : X1;
  const start = performance.now(), dur = 420;
  function step(t) {
    const f = Math.min(1, (t - start) / dur);
    const eased = f < 1 ? f : 1;
    pulse.setAttribute("cx", from + (to - from) * eased);
    core.setAttribute("stroke", color);
    core.setAttribute("opacity", 0.35 + 0.65 * Math.sin(eased * Math.PI));
    if (f < 1) { requestAnimationFrame(step); }
    else { pulse.setAttribute("opacity", "0"); core.setAttribute("opacity", "1"); if (onArrive) onArrive(); }
  }
  requestAnimationFrame(step);
}

function settle(kind) {
  // kind: "pass" | "gap" | "deny"
  const color = kind === "pass" ? "#37d67a" : kind === "gap" ? "#f5a623" : "#ff5468";
  coreFlash.setAttribute("stroke", color);
  coreFlash.setAttribute("opacity", "0.9");
  coreFlash.setAttribute("filter", "url(#softglow)");
  core.setAttribute("stroke", color);
  setTimeout(() => {
    coreFlash.setAttribute("opacity", "0");
    core.setAttribute("stroke", "#2a3644");
  }, 900);
}

let phaseTimer = null;
function setPhase(text, color) {
  const el = $("phase");
  el.textContent = text;
  el.style.color = color || "var(--dim)";
  clearTimeout(phaseTimer);
  if (text !== "idle") phaseTimer = setTimeout(() => setPhase("idle"), 2600);
}

function setReadout(text, cls) {
  readout.innerHTML = cls ? `<span class="verdict ${cls}">${text}</span>` : text;
}

// ---------------- data panel ----------------
function row(i, val) { $("dataTable").rows[i].cells[1].textContent = val ?? "—"; }
function trunc(h, n = 28) { return h && h.length > n ? h.slice(0, n) + "…" : h; }

// ---------------- log ----------------
function srcClass(s) {
  if (s === "gateway") return "gw";
  if (s === "verifier") return "ver";
  return "";
}
function appendLog(evt) {
  const line = document.createElement("div");
  line.className = "le";
  const t = new Date(evt.ts * 1000).toLocaleTimeString();
  line.innerHTML = `<span class="t">${t}</span><span class="src ${srcClass(evt.source)}">${evt.source}</span> <span class="kind">${evt.kind}</span>`;
  const logDiv = $("log");
  logDiv.appendChild(line);
  if (logDiv.children.length > 400) logDiv.removeChild(logDiv.firstChild);
  logDiv.scrollTop = logDiv.scrollHeight;
}

// ---------------- event handling ----------------
function handleEvent(evt) {
  appendLog(evt);
  const d = evt.data || {};
  switch (evt.kind) {
    case "phase1_request_sent":
      setPhase("phase 1", "var(--blue)");
      row(0, d.client_id);
      travel("out", "#4da3ff");
      break;
    case "phase1_established":
      if (evt.source.startsWith("client")) {
        travel("back", "#4da3ff");
        row(1, trunc(d.x_hex, 44)); row(2, trunc(d.k_hex, 44)); row(3, d.c);
      }
      break;
    case "verifier_check_phase1":
      setLeds({Secrecy:true, Alive:true, Weakagree:true, Niagree:true, Nisynch:true});
      setReadout("phase 1 — secure", "pass");
      settle("pass");
      break;
    case "phase2_request_sent":
      setPhase(d.hardened ? "phase 2 · hardened" : "phase 2 · as specified", "var(--blue)");
      row(0, d.client_id); row(4, trunc(d.alpha_hex, 44)); row(5, d.identifier_msg); row(6, d.t_msg);
      row(7, "—");
      travel("out", d.tampered ? "#ff5468" : "#4da3ff");
      break;
    case "phase2_approved":
      travel("back", "#4da3ff");
      break;
    case "phase2_denied":
      travel("back", "#ff5468");
      setReadout("denied — " + (d.reason || ""), "deny");
      settle("deny");
      break;
    case "verifier_check":
      setLeds(d.properties);
      row(7, d.status_mac_ok === true ? "✓ valid" : d.status_mac_ok === false ? "✗ invalid" : "—");
      if (d.status === "Approved") {
        if (d.all_pass) { setReadout("approved — secure (hardened)", "pass"); settle("pass"); }
        else { setReadout("approved — niagree/nisynch gap (as specified)", "gap"); settle("gap"); }
      }
      break;
  }
}

// ---------------- websocket ----------------
function connectWS() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onopen = () => { $("wsDot").className = "dot on"; $("wsLabel").textContent = "connected"; };
  ws.onclose = () => { $("wsDot").className = "dot off"; $("wsLabel").textContent = "reconnecting"; setTimeout(connectWS, 1500); };
  ws.onerror = () => ws.close();
  ws.onmessage = (msg) => {
    const payload = JSON.parse(msg.data);
    if (payload.kind === "backlog") payload.events.slice(-30).forEach(appendLog);
    else handleEvent(payload);
  };
}
connectWS();

// ---------------- REST controls ----------------
async function postJSON(url, body) {
  const r = await fetch(url, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)});
  return r.json();
}
function showResult(json) {
  const el = $("ctrlResult");
  el.className = "result " + (json.ok && json.status !== "Denied" ? "pass" : "fail");
  el.textContent = json.status || json.error || (json.ok ? "ok" : "failed");
}

$("btnRegister").onclick = async () => {
  $("btnRegister").disabled = true;
  showResult(await postJSON("/api/register", {client_id: $("clientId").value}));
  $("btnRegister").disabled = false;
};
$("btnPublish").onclick = async () => showResult(await postJSON("/api/publish", {
  client_id: $("clientId").value, topic: $("topic").value, payload: $("payload").value,
  encrypt: $("encrypt").checked, hardened: $("hardened").checked,
}));
$("btnTamper").onclick = async () => showResult(await postJSON("/api/publish", {
  client_id: $("clientId").value, topic: $("topic").value, payload: $("payload").value,
  tamper: true, hardened: $("hardened").checked,
}));
$("btnReplay").onclick = async () => showResult(await postJSON("/api/publish", {
  client_id: $("clientId").value, topic: $("topic").value, payload: $("payload").value,
  replay: true, hardened: $("hardened").checked,
}));
</script>
</body>
</html>
