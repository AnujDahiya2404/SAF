<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAF</title>
<style>
  :root{
    --bg:#f7f8fa; --surface:#ffffff; --line:#e5e7eb; --line-strong:#d1d5db;
    --text:#0f172a; --dim:#6b7280;
    --blue:#2563eb; --green:#16a34a; --amber:#d97706; --red:#dc2626;
    --mono:'SF Mono',Menlo,Consolas,monospace;
    --radius:10px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{background:var(--bg);color:var(--text);
       font-family:-apple-system,'Segoe UI',Helvetica,sans-serif;
       display:flex;flex-direction:column}

  header{flex:0 0 auto;padding:16px 28px 10px;display:flex;align-items:baseline;gap:10px}
  header h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.02em}

  .stage{flex:0 0 auto;max-width:1180px;width:100%;margin:0 auto;padding:0 28px}
  .topo{position:relative;height:190px;user-select:none}

  .track{position:absolute;top:50%;height:7px;margin-top:-3.5px;border-radius:4px;background:var(--line)}
  .fill{position:absolute;top:50%;height:7px;margin-top:-3.5px;border-radius:4px;
        width:0;opacity:0;transition:opacity .25s}
  .topic-tag{position:absolute;top:50%;margin-top:-27px;transform:translate(-50%,0);
             font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:5px;
             background:var(--surface);border:1px solid var(--line-strong);white-space:nowrap;
             opacity:0;pointer-events:none;z-index:6;box-shadow:0 1px 2px rgba(0,0,0,.04)}

  /* .node wraps ONLY .box, so translate(-50%,-50%) centers the box itself
     on the wire's y=50% line; .meta (label+sub) is positioned absolutely
     below it and never affects that centering. Previously .box, .lbl and
     .sub were centered together as one flex column, which put the box's
     true center well above the wire -- the wire ended up crossing near the
     box's bottom edge instead of through its middle. */
  .node{position:absolute;top:50%;transform:translate(-50%,-50%);
        background:none;border:none;cursor:pointer;z-index:4;padding:0;line-height:0}
  .node[disabled]{cursor:default}
  .node .box{width:72px;height:58px;border-radius:var(--radius);background:var(--surface);
             border:1.5px solid var(--line-strong);display:flex;align-items:center;justify-content:center;
             box-shadow:0 1px 3px rgba(15,23,42,.06);transition:border-color .2s, box-shadow .2s}
  .node.selected .box{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.14)}
  .node .meta{position:absolute;top:100%;left:50%;transform:translate(-50%,0);
              margin-top:9px;width:130px;text-align:center;line-height:normal}
  .node .lbl{font-size:12px;font-weight:600;color:var(--text)}
  .node .sub{font-size:9.5px;color:var(--dim);font-family:var(--mono);margin-top:2px}
  .node svg{width:32px;height:30px}

  .readout{text-align:center;margin-top:0;min-height:20px;font-family:var(--mono);
           font-size:12px;color:var(--dim)}
  .readout .v{font-weight:700}
  .readout .v.pass{color:var(--green)} .readout .v.gap{color:var(--amber)} .readout .v.deny{color:var(--red)}

  .tap{position:absolute;top:50%;margin-top:30px;transform:translate(-50%,0);
       display:flex;flex-direction:column;align-items:center;opacity:0;transition:opacity .2s;z-index:3}
  .tap.show{opacity:1}
  .tap .stem{width:1.5px;height:12px;background:var(--line-strong)}
  .tap .box{background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:5px 9px;
            display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 1px 3px rgba(15,23,42,.06)}
  .tap .name{font-size:8.5px;color:var(--dim);font-family:var(--mono);letter-spacing:.04em}
  .tap .leds{display:flex;gap:5px}
  .tap .led{width:6px;height:6px;border-radius:50%;background:var(--line-strong);transition:.2s}
  .tap .led.pass{background:var(--green)}
  .tap .led.fail{background:var(--red)}

  .panel{flex:0 0 auto;max-width:1180px;width:100%;margin:0 auto;padding:0 28px}
  .hint{text-align:center;color:var(--dim);font-size:12.5px;padding:16px 0}
  .ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 0;
        border-top:1px solid var(--line)}
  .ctrl input[type=text]{background:var(--surface);border:1px solid var(--line-strong);color:var(--text);
        border-radius:7px;padding:7px 10px;font-size:12.5px;font-family:var(--mono);min-width:100px}
  .ctrl input[type=text]:focus{outline:none;border-color:var(--blue)}
  button.btn{background:var(--surface);border:1px solid var(--line-strong);color:var(--text);padding:7px 13px;
         border-radius:7px;font-size:12.5px;cursor:pointer;font-weight:600;transition:.15s}
  button.btn:hover{border-color:var(--blue);color:var(--blue)}
  button.btn:disabled{opacity:.4;cursor:default}
  button.btn.go{background:var(--blue);border-color:var(--blue);color:#fff}
  button.btn.go:hover{color:#fff;filter:brightness(1.08)}
  button.btn.warn{color:var(--amber);border-color:#fde3c0}
  button.btn.bad{color:var(--red);border-color:#f9d0d5}
  .switch{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);cursor:pointer}
  .switch input{display:none}
  .track-sw{width:30px;height:17px;border-radius:99px;background:var(--line);border:1px solid var(--line-strong);position:relative}
  .track-sw::after{content:"";position:absolute;top:1px;left:1px;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:.2s}
  .switch input:checked + .track-sw{background:var(--green);border-color:var(--green)}
  .switch input:checked + .track-sw::after{transform:translateX(13px)}
  .spacer{flex:1}
  .pill-result{font-family:var(--mono);font-size:11.5px;color:var(--dim)}
  .pill-result.pass{color:var(--green)} .pill-result.fail{color:var(--red)}

  /* ---------------- sequence diagram ---------------- */
  .seq-wrap{flex:1 1 auto;min-height:0;max-width:1180px;width:100%;margin:0 auto;
            padding:0 28px 16px;display:flex;flex-direction:column}
  .seq-head{display:grid;grid-template-columns:1fr 1fr 1fr;padding:9px 0 7px;
            border-top:1px solid var(--line);flex:0 0 auto}
  .seq-head div{text-align:center;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);font-weight:600}
  #seq{flex:1 1 auto;min-height:0;overflow-y:auto}
  #seq .seq-inner{position:relative;min-height:100%}
  #seq .lifeline{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed var(--line);z-index:0}
  #seq .rows{position:relative;z-index:1}
  .row{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;min-height:28px;padding:1px 0}
  .arrow{grid-column:1/3;position:relative;font-family:var(--mono);font-size:10.5px;padding:0 8px}
  .arrow.right2{grid-column:2/4}
  .arrow .line{height:2px;background:var(--c,var(--blue));position:relative;margin-top:13px}
  .arrow .line::after{content:"";position:absolute;top:-3px;width:0;height:0;
        border-top:4px solid transparent;border-bottom:4px solid transparent}
  .arrow.fwd .line::after{right:0;border-left:7px solid var(--c,var(--blue))}
  .arrow.bwd .line::after{left:0;border-right:7px solid var(--c,var(--blue))}
  .arrow .lbl{font-size:10px;color:var(--c,var(--blue));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .arrow .detail{font-size:9.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .note{grid-column:1/4;text-align:center;font-family:var(--mono);font-size:9.5px;color:var(--dim);
        padding:4px 0}
  .note b{color:var(--text);font-weight:600}
</style>
</head>
<body>

<header><h1>SAF</h1></header>

<div class="stage">
  <div class="topo" id="topo">
    <div class="track" id="trackL" style="left:16%;width:32%"></div>
    <div class="track" id="trackR" style="left:52%;width:32%"></div>
    <div class="fill" id="fillL"></div>
    <div class="fill" id="fillR"></div>
    <div class="topic-tag" id="topicTag"></div>

    <button class="node" id="nodePublisher" data-role="publisher" style="left:10%">
      <div class="box"><svg viewBox="0 0 32 32" fill="none" stroke="#334155" stroke-width="1.6"><rect x="6" y="6" width="20" height="20" rx="3"/><circle cx="16" cy="16" r="5"/><path d="M16 2v4M16 26v4M2 16h4M26 16h4"/></svg></div>
      <div class="meta"><div class="lbl">Publisher</div><div class="sub" id="pubSub">click to configure</div></div>
    </button>

    <button class="node" id="nodeBroker" disabled style="left:50%">
      <div class="box"><svg viewBox="0 0 32 32" fill="none" stroke="#334155" stroke-width="1.6"><rect x="4" y="4" width="24" height="7" rx="1.5"/><rect x="4" y="13" width="24" height="7" rx="1.5"/><rect x="4" y="22" width="24" height="7" rx="1.5"/><circle cx="9" cy="7.5" r="1" fill="#334155"/><circle cx="9" cy="16.5" r="1" fill="#334155"/><circle cx="9" cy="25.5" r="1" fill="#334155"/></svg></div>
      <div class="meta"><div class="lbl">Broker</div><div class="sub">Gateway + Mosquitto</div></div>
    </button>

    <button class="node" id="nodeSubscriber" data-role="subscriber" style="left:90%">
      <div class="box"><svg viewBox="0 0 32 32" fill="none" stroke="#334155" stroke-width="1.6"><path d="M8 13a8 8 0 0 1 16 0v6l3 4H5l3-4z"/><path d="M13 26a3 3 0 0 0 6 0"/></svg></div>
      <div class="meta"><div class="lbl">Subscriber</div><div class="sub" id="subSub">click to configure</div></div>
    </button>

    <div class="tap" id="tap">
      <div class="stem"></div>
      <div class="box">
        <div class="name">runtime verifier</div>
        <div class="leds">
          <span class="led" data-p="Secrecy" title="Secrecy"></span>
          <span class="led" data-p="Alive" title="Alive"></span>
          <span class="led" data-p="Weakagree" title="Weakagree"></span>
          <span class="led" data-p="Niagree" title="Niagree"></span>
          <span class="led" data-p="Nisynch" title="Nisynch"></span>
        </div>
      </div>
    </div>
  </div>
  <div class="readout" id="readout">click a node to begin</div>
</div>

<div class="panel">
  <div id="pubCtrl" class="ctrl" style="display:none">
    <input type="text" id="pubId" value="AA:BB:CC:00:11:01">
    <button class="btn go" id="btnPubRegister">Register</button>
    <input type="text" id="pubTopic" value="sensors/temperature" style="min-width:150px">
    <input type="text" id="pubPayload" value="temp=23.5C" style="min-width:110px">
    <label class="switch"><input type="checkbox" id="pubEncrypt"><span class="track-sw"></span>ascon</label>
    <button class="btn" id="btnPublish">Publish</button>
    <button class="btn warn" id="btnTamper">Tamper</button>
    <button class="btn bad" id="btnReplay">Replay</button>
    <span class="spacer"></span>
    <span class="pill-result" id="pubResult"></span>
  </div>

  <div id="subCtrl" class="ctrl" style="display:none">
    <input type="text" id="subId" value="AA:BB:CC:00:22:02">
    <button class="btn go" id="btnSubRegister">Register</button>
    <input type="text" id="subTopic" value="sensors/temperature" style="min-width:150px">
    <button class="btn" id="btnSubscribe">Subscribe</button>
    <span class="spacer"></span>
    <span class="pill-result" id="subResult"></span>
  </div>

  <div class="hint" id="hint">select the publisher or the subscriber above to configure it</div>
</div>

<div class="seq-wrap">
  <div class="seq-head"><div>Publisher</div><div>Broker</div><div>Subscriber</div></div>
  <div id="seq">
    <div class="seq-inner">
      <div class="lifeline" style="left:16.6%"></div>
      <div class="lifeline" style="left:50%"></div>
      <div class="lifeline" style="left:83.3%"></div>
      <div class="rows" id="seqRows"></div>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);

// The server keeps client state (registered or not) in memory for as long
// as it runs, keyed only by client_id -- it is NOT reset per page load or
// per browser tab. A fixed default id would make "publish before
// registering" silently succeed on every reload after the first, once that
// id has ever been registered once. Generating a fresh, never-before-seen
// id per page load is what actually makes the unregistered-client denial
// demonstrable every time.
function randomMac(prefix) {
  const byte = () => Math.floor(Math.random() * 256).toString(16).padStart(2, "0").toUpperCase();
  return `${prefix}:${byte()}:${byte()}:${byte()}`;
}
$("pubId").value = randomMac("AA:BB:CC");
$("subId").value = randomMac("BB:CC:DD");

// ---------------- role/client state ----------------
const roles = {
  publisher: {clientId: $("pubId").value, registered: false, x:null, k:null, c:null},
  subscriber: {clientId: $("subId").value, registered: false, x:null, k:null, c:null, subscribedTopic: null},
};
let selected = null; // 'publisher' | 'subscriber' | null
const lastVerdict = {};      // clientId -> {Secrecy:.., Alive:.., ...}
const phase1Done = {};       // clientId -> true

// ---------------- node selection ----------------
function selectNode(role) {
  selected = (selected === role) ? null : role;
  $("nodePublisher").classList.toggle("selected", selected === "publisher");
  $("nodeSubscriber").classList.toggle("selected", selected === "subscriber");
  $("pubCtrl").style.display = selected === "publisher" ? "flex" : "none";
  $("subCtrl").style.display = selected === "subscriber" ? "flex" : "none";
  $("hint").style.display = selected ? "none" : "block";
  clearTimeout(readoutTimer);
  readout.textContent = selected ? "" : "click a node to begin";
  updateTap();
}
$("nodePublisher").onclick = () => selectNode("publisher");
$("nodeSubscriber").onclick = () => selectNode("subscriber");

function updateTap() {
  const tap = $("tap");
  if (!selected) { tap.classList.remove("show"); return; }
  tap.classList.add("show");
  tap.style.left = selected === "publisher" ? "33%" : "67%";
  const cid = roles[selected].clientId;
  const verdict = lastVerdict[cid];
  const leds = [...tap.querySelectorAll(".led")];
  leds.forEach(el => {
    el.classList.remove("pass", "fail");
    if (verdict) {
      el.classList.add(verdict[el.dataset.p] ? "pass" : "fail");
    } else if (phase1Done[cid]) {
      el.classList.add("pass"); // phase 1 only -- no known live gap, matches saf_phase1.spdl
    }
  });
}

// ---------------- wire mechanics: a smooth directional fill, not a dot ----------------
const trackL = $("trackL"), trackR = $("trackR"), fillL = $("fillL"), fillR = $("fillR"), topicTag = $("topicTag");
const readout = $("readout");
const X = {publisher: 10, broker: 50, subscriber: 90};
const SEG = {
  L: {left: 16, width: 32, right: 52},   // matches #trackL's left/width above
  R: {left: 52, width: 32, right: 84},   // matches #trackR's left/width above
};

function segFor(a, b) {
  return ((a === "broker" && b === "subscriber") || (a === "subscriber" && b === "broker")) ? "R" : "L";
}

// Every wire effect (a fill sweeping in, or a settle-color hold) is queued
// and played strictly one at a time, at a deliberately slow, watchable pace
// -- real round trips (tens of ms) are far faster than the animation, so
// without this queue a second event's effect starts before the first has
// visually finished and the two fight over the same fill element.
let animQueue = Promise.resolve();
function enqueue(fn) {
  animQueue = animQueue.then(fn);
  return animQueue;
}

const TRAVEL_MS = 1400, SETTLE_MS = 1500;

function flow(from, to, color, topic) {
  return enqueue(() => new Promise(resolve => {
    const key = segFor(from, to);
    const seg = SEG[key];
    const fill = key === "L" ? fillL : fillR;
    const forward = X[to] > X[from]; // moving left-to-right?

    fill.style.transition = "none";
    fill.style.background = color;
    fill.style.opacity = "1";
    if (forward) {
      fill.style.right = "auto";
      fill.style.left = seg.left + "%";
      fill.style.width = "0%";
    } else {
      fill.style.left = "auto";
      fill.style.right = (100 - seg.right) + "%";
      fill.style.width = "0%";
    }
    if (topic) {
      topicTag.textContent = topic;
      topicTag.style.opacity = "1";
      topicTag.style.color = color;
      topicTag.style.left = (forward ? seg.left : seg.right) + "%";
    }
    const start = performance.now();
    function step(t) {
      const f = Math.min(1, (t - start) / TRAVEL_MS);
      fill.style.width = (seg.width * f) + "%";
      if (topic) topicTag.style.left = (forward ? seg.left + seg.width * f : seg.right - seg.width * f) + "%";
      if (f < 1) { requestAnimationFrame(step); }
      else { topicTag.style.opacity = "0"; resolve(); }
    }
    requestAnimationFrame(step);
  }));
}

function settle(link, kind) {
  return enqueue(() => new Promise(resolve => {
    const color = kind === "pass" ? "#16a34a" : kind === "gap" ? "#d97706" : "#dc2626";
    const fill = link === "R" ? fillR : fillL;
    fill.style.background = color;
    setTimeout(() => {
      fill.style.transition = "opacity .4s";
      fill.style.opacity = "0";
      resolve();
    }, SETTLE_MS);
  }));
}

let readoutTimer = null;
function setReadout(text, cls) {
  readout.innerHTML = cls ? `<span class="v ${cls}">${text}</span>` : text;
  clearTimeout(readoutTimer);
  if (text) readoutTimer = setTimeout(() => { readout.textContent = selected ? "" : "click a node to begin"; }, 4500);
}

// ---------------- sequence diagram ---------------- //
function trunc(h, n = 18) { return h && h.length > n ? h.slice(0, n) + "…" : h; }
function addRow(html) {
  const seq = $("seq"), rows = $("seqRows");
  const atBottom = seq.scrollTop + seq.clientHeight >= seq.scrollHeight - 40;
  const div = document.createElement("div");
  div.innerHTML = html;
  rows.appendChild(div.firstElementChild);
  while (rows.children.length > 300) rows.removeChild(rows.firstChild);
  if (atBottom) seq.scrollTop = seq.scrollHeight;
}
// semanticDir: "toBroker" (client -> broker) or "toClient" (broker -> client).
// "fwd" (CSS) always means "arrowhead on the right of this row's span" and
// "bwd" means "on the left" -- which node that visually points at flips
// between the Publisher|Broker span (right = Broker) and the Broker|
// Subscriber span (right = Subscriber), so the CSS direction has to be
// derived from the semantic direction + which span this is, never hardcoded.
function addArrow(semanticDir, role, label, detail, color) {
  const span2 = role === "subscriber";
  const dir = semanticDir === "toBroker" ? (span2 ? "bwd" : "fwd") : (span2 ? "fwd" : "bwd");
  const cls = "arrow " + dir + (span2 ? " right2" : "");
  addRow(`<div class="row"><div class="${cls}" style="--c:${color}">
      <div class="lbl">${label}</div><div class="line"></div><div class="detail">${detail}</div>
    </div></div>`);
}
function addNote(text) {
  addRow(`<div class="row"><div class="note"><b>store</b> ${text}</div></div>`);
}

// ---------------- event handling ---------------- //
function handleEvent(evt) {
  const d = evt.data || {};
  switch (evt.kind) {
    case "phase1_established":
      if (evt.source.startsWith("client")) {
        phase1Done[d.client_id] = true;
        const role = roles.publisher.clientId === d.client_id ? "publisher"
                    : roles.subscriber.clientId === d.client_id ? "subscriber" : null;
        if (role) {
          roles[role].registered = true; roles[role].x = d.x_hex; roles[role].k = d.k_hex; roles[role].c = d.c;
          $(role === "publisher" ? "pubSub" : "subSub").textContent = "registered · c=" + d.c;
        }
        flow("broker", role || "publisher", "#2563eb");
        addArrow("toClient", role, "PreSessionResponse", `x=${trunc(d.x_hex)} k=${trunc(d.k_hex)} c=${d.c}`, "#2563eb");
        addNote(`${d.client_id} → x=h(client_state)=${trunc(d.x_hex,14)}…, k=${trunc(d.k_hex,14)}…, c=${d.c}`);
        if (selected === role) updateTap();
      }
      break;

    case "phase1_request_sent": {
      const role = roles.publisher.clientId === d.client_id ? "publisher"
                  : roles.subscriber.clientId === d.client_id ? "subscriber" : null;
      flow(role || "publisher", "broker", "#2563eb");
      addArrow("toBroker", role, "PreSessionRequest", `client_id=${d.client_id}`, "#2563eb");
      break;
    }

    case "phase2_request_sent": {
      if (!evt.source.startsWith("client")) break;
      const role = roles.publisher.clientId === d.client_id ? "publisher"
                  : roles.subscriber.clientId === d.client_id ? "subscriber" : null;
      if (!role) break;
      const isSub = d.intent === "subscribe";
      flow(role, "broker", d.tampered ? "#dc2626" : "#2563eb", d.topic);
      addArrow("toBroker", role, isSub ? "SubscribeRequest" : "PublishRequest",
        `α=${trunc(d.alpha_hex)} idmsg=${trunc(d.identifier_msg,10)} topic=${d.topic}`,
        d.tampered ? "#dc2626" : "#2563eb");
      if (selected === role) setReadout((isSub ? "subscribing to " : "publishing to ") + d.topic);
      break;
    }

    case "phase2_approved": {
      const role = roles.publisher.clientId === d.client_id ? "publisher"
                  : roles.subscriber.clientId === d.client_id ? "subscriber" : null;
      if (role) flow("broker", role, "#2563eb");
      break;
    }
    case "phase2_denied": {
      const role = roles.publisher.clientId === d.client_id ? "publisher"
                  : roles.subscriber.clientId === d.client_id ? "subscriber" : null;
      if (role) {
        flow("broker", role, "#dc2626");
        settle(role === "subscriber" ? "R" : "L", "deny");
        addArrow("toClient", role, "VerificationStatus", `Denied — ${d.reason || ""}`, "#dc2626");
        if (selected === role) setReadout("denied — " + (d.reason || ""), "deny");
      }
      break;
    }

    case "verifier_check": {
      lastVerdict[d.client_id] = d.properties;
      if (selected && roles[selected].clientId === d.client_id) updateTap();
      const role = roles.publisher.clientId === d.client_id ? "publisher"
                  : roles.subscriber.clientId === d.client_id ? "subscriber" : null;
      if (role && d.status === "Approved") {
        // Algorithm 2 exactly as specified never binds alpha to
        // identifier_msg/t_msg, so Niagree/Nisynch always fail here --
        // this is the live reproduction of scyther/saf_phase2.spdl's real
        // result, not a bug. See README.md section 2.
        const kind = d.all_pass ? "pass" : "gap";
        settle(role === "subscriber" ? "R" : "L", kind);
        addArrow("toClient", role, "VerificationStatus", "Approved", kind === "pass" ? "#16a34a" : "#d97706");
        if (selected === role) {
          setReadout(d.all_pass ? "secure" : "niagree/nisynch gap (base paper, Algorithm 2)", kind);
        }
      }
      break;
    }

    case "phase2_relayed": {
      // real data leaving the broker toward app/<topic> -- if the subscriber
      // is subscribed to this exact topic, animate broker -> subscriber too.
      if (roles.subscriber.subscribedTopic === d.topic) {
        setTimeout(() => flow("broker", "subscriber", "#16a34a", d.topic), 120);
      }
      break;
    }
    case "app_message_received": {
      if (d.client_id !== roles.subscriber.clientId) break;
      addArrow("toClient", "subscriber", "AppData (relayed)", `topic=${d.topic}`, "#16a34a");
      if (selected === "subscriber") setReadout("received on " + d.topic, "pass");
      break;
    }
  }
}

// ---------------- websocket ---------------- //
function connectWS() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onclose = () => setTimeout(connectWS, 1500);
  ws.onerror = () => ws.close();
  ws.onmessage = (msg) => {
    const payload = JSON.parse(msg.data);
    if (payload.kind !== "backlog") handleEvent(payload);
  };
}
connectWS();

// ---------------- REST ---------------- //
async function postJSON(url, body) {
  const r = await fetch(url, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)});
  return r.json();
}
function showResult(elId, json) {
  const el = $(elId);
  el.className = "pill-result " + (json.ok && json.status !== "Denied" ? "pass" : "fail");
  el.textContent = json.status || json.error || (json.ok ? "ok" : "failed");
}

$("btnPubRegister").onclick = async () => {
  roles.publisher.clientId = $("pubId").value;
  showResult("pubResult", await postJSON("/api/register", {client_id: roles.publisher.clientId}));
};
$("btnPublish").onclick = async () => showResult("pubResult", await postJSON("/api/publish", {
  client_id: roles.publisher.clientId, topic: $("pubTopic").value, payload: $("pubPayload").value,
  encrypt: $("pubEncrypt").checked,
}));
$("btnTamper").onclick = async () => showResult("pubResult", await postJSON("/api/publish", {
  client_id: roles.publisher.clientId, topic: $("pubTopic").value, payload: $("pubPayload").value, tamper: true,
}));
$("btnReplay").onclick = async () => showResult("pubResult", await postJSON("/api/publish", {
  client_id: roles.publisher.clientId, topic: $("pubTopic").value, payload: $("pubPayload").value, replay: true,
}));

$("btnSubRegister").onclick = async () => {
  roles.subscriber.clientId = $("subId").value;
  showResult("subResult", await postJSON("/api/register", {client_id: roles.subscriber.clientId}));
};
$("btnSubscribe").onclick = async () => {
  const topic = $("subTopic").value;
  const json = await postJSON("/api/subscribe", {
    client_id: roles.subscriber.clientId, topic,
  });
  if (json.ok && json.status === "Approved") roles.subscriber.subscribedTopic = topic;
  showResult("subResult", json);
};
</script>
